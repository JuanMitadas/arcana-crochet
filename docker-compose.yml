# Development environment: docker compose up
# The code is mounted as a volume, so changes show up without a rebuild.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: arcana
      POSTGRES_USER: arcana
      POSTGRES_PASSWORD: arcana
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcana -d arcana"]
      interval: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS: dev
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      DATABASE_URL: postgres://arcana:arcana@db:5432/arcana
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
