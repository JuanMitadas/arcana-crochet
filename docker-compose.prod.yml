# Produção no VPS: docker compose -f docker-compose.prod.yml up -d --build
# Variáveis em .env.prod (ver .env.example). Nada além do Caddy fica exposto.
x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: arcana-crochet:latest
  env_file: .env.prod
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env.prod  # usa a variável DOMINIO
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - media:/srv/media:ro
    depends_on:
      - web

  web:
    <<: *app
    environment:
      RUN_MIGRATIONS: "1"
    volumes:
      - media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: celery -A config worker -l info --concurrency 2
    volumes:
      - media:/app/media

  beat:
    <<: *app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no

volumes:
  pgdata:
  caddy_data:
  media:
