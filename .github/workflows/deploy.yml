name: Deploy na AWS

# Publica a loja a cada push na main (produção) ou quando rodado à mão.
# Configuração (uma vez) em docs/deploy.md: environment "producao" no GitHub com os
# secrets AWS_ROLE_ARN e DATABASE_URL_DIRETA e as variáveis DOMINIO e CERTIFICADO_ARN.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # para assumir o papel na AWS via OIDC, sem chave guardada
  contents: read

concurrency:
  group: deploy-producao
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  STACK: arcana-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: producao
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Montar a imagem da Lambda
        run: sam build --template-file infra/template.yaml

      - name: Aplicar migrações no Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRETA }}
          SECRET_KEY: so-para-as-migracoes-${{ github.run_id }}
        run: |
          pip install -r requirements/base.txt
          python manage.py migrate --noinput
          python manage.py createcachetable

      - name: Publicar
        env:
          DOMINIO: ${{ vars.DOMINIO }}
          CERTIFICADO_ARN: ${{ vars.CERTIFICADO_ARN }}
        run: |
          repositorio=$(aws cloudformation describe-stacks --stack-name arcana-base \
            --query "Stacks[0].Outputs[?OutputKey=='RepositorioImagens'].OutputValue" --output text)
          parametros=("Ambiente=prod")
          if [ -n "$DOMINIO" ]; then
            parametros+=("Dominio=$DOMINIO" "CertificadoArn=$CERTIFICADO_ARN")
          fi
          sam deploy \
            --stack-name "$STACK" \
            --region "$AWS_REGION" \
            --image-repository "$repositorio" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${parametros[@]}"

      - name: Resumo
        run: |
          endereco=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='EnderecoSite'].OutputValue" --output text)
          echo "### Loja publicada: $endereco" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS --retry 5 --retry-delay 5 "$endereco/healthz/?banco=1"
