[project]
name = "arcana-crochet"
version = "0.1.0"
description = "Loja virtual da Arcana Crochet"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = ["S101"]  # assert é usado nos testes

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
# Dados e imagens de demonstração: aleatoriedade não criptográfica e textos longos
"apps/catalogo/demo_imagens.py" = ["S311"]
"apps/catalogo/management/commands/popular_demo.py" = ["S311", "S105", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
filterwarnings = [
    # O WhiteNoise avisa quando ainda não rodou o collectstatic; irrelevante nos testes.
    "ignore:No directory at:UserWarning",
]
