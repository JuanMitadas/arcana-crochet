[project]
name = "arcana-crochet"
version = "0.1.0"
description = "Arcana Crochet online store"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*", "config/migracoes/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = ["S101"]  # tests use assert

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
# Demo data and images: non-cryptographic randomness and long strings
"apps/catalogo/demo_imagens.py" = ["S311"]
"apps/catalogo/management/commands/popular_demo.py" = ["S311", "S105", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
filterwarnings = [
    # WhiteNoise warns when collectstatic hasn't run yet; irrelevant for tests.
    "ignore:No directory at:UserWarning",
    # django-unfold still uses the pre-6.1 signature; harmless until it updates.
    "ignore:Overriding get_action_choices",
]
